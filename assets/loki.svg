<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Deep OS / Terminal Background -->
  <rect width="500" height="500" rx="100" fill="#0f172a" />

  <!-- Asgardian Tech Gradients -->
  <defs>
    <linearGradient id="gold" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- LEFT HORN (Thick, geometric sweep) -->
  <path d="M 210 270 C 120 270, 80 140, 110 70 C 130 140, 170 220, 230 240" 
        fill="none" stroke="url(#gold)" stroke-width="26" stroke-linecap="round" filter="url(#glow)"/>
        
  <!-- RIGHT HORN (Thick, geometric sweep) -->
  <path d="M 290 270 C 380 270, 420 140, 390 70 C 370 140, 330 220, 270 240" 
        fill="none" stroke="url(#gold)" stroke-width="26" stroke-linecap="round" filter="url(#glow)"/>

  <!-- HELMET BASE / CROWN -->
  <path d="M 160 270 Q 250 180 340 270 L 310 350 Q 250 380 190 350 Z" 
        fill="url(#gold)" />
  
  <!-- INNER VISOR (Negative Space Cutout) -->
  <path d="M 180 280 Q 250 220 320 280 L 290 330 Q 250 350 210 330 Z" 
        fill="#0f172a" />

  <!-- THE GEMMA E4B CORE (Center Emerald) -->
  <polygon points="250,230 275,265 250,300 225,265" fill="url(#emerald)" filter="url(#glow)"/>

  <!-- THE 3 EXECUTION NODES (System Architecture Symbolism) -->
  <!-- Tier 1: CLI Execution (Left Horn Tip) -->
  <circle cx="110" cy="70" r="14" fill="url(#emerald)" filter="url(#glow)" />
  <!-- Tier 3: Vision Fallback (Right Horn Tip) -->
  <circle cx="390" cy="70" r="14" fill="url(#emerald)" filter="url(#glow)" />
  <!-- Tier 2: Semantic UI Tree (Base Kernel Hook) -->
  <circle cx="250" cy="380" r="16" fill="url(#emerald)" filter="url(#glow)" />
  
  <!-- Data Trace connecting the Core to the Kernel Node -->
  <path d="M 250 300 L 250 380" stroke="url(#emerald)" stroke-width="8" />

</svg>
